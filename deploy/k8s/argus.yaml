# Stage one: move argus from systemd to a single-node k3s on the SAME VPS, behaving
# exactly like deploy/argus.service and changing only how it is run. This is not a
# portable manifest; the two shortcuts below must be replaced before leaving this
# machine:
#
#   hostNetwork  Shioaji stays under systemd (127.0.0.1:8080) and the dashboard stays
#                loopback-only (WEB_ADDR=127.0.0.1:8090). The dashboard has no read
#                auth, so it must never be put behind a Service or Ingress as-is.
#   hostPath     The whole home is mounted: .env, data/, ~/.claude and
#                ~/.local/bin/agy all stay where they are. A directory rather than
#                single files, because claude rewrites ~/.claude.json via rename and a
#                single-file bind mount breaks on that.
#
# Before the first apply, stop the systemd copy. Running both means Telegram 409s,
# duplicated cron jobs, and two writers on one SQLite file:
#   systemctl --user disable --now argus && systemctl --user mask argus
# Mask rather than just disable: anything that restarts the unit (a stray
# `systemctl --user start`, a leftover runner job) fails loudly on a masked unit
# instead of quietly starting a second copy.
# If you forget: the pod can't bind 127.0.0.1:8090 and exits (app.Run treats a
# listener failure as fatal), so it crash-loops rather than silently running twice.
#
# Rollback:
#   kubectl delete deployment/argus
#   systemctl --user unmask argus && systemctl --user start argus
# The data directory is the same one, so rolling back loses nothing. The binary the unit
# runs (~/apps/argus/argus) is the last one the old systemd deploy installed and is no
# longer updated, so a rollback runs that older build.
#
# The image is built by CI, pushed to GHCR and `k3s ctr images pull`ed onto the node by
# the deploy job, tagged with the git sha. That pre-pull is why imagePullPolicy is
# Never: the kubelet never talks to the registry, so no imagePullSecret is needed. The
# workflow substitutes the real ghcr.io reference for argus:dev below before applying.
#
# __HOME__, __UID__ and __GID__ are filled the same way, from the account the runner
# runs as (the one that owns the home that is mounted), so no user name is written
# here. Kubernetes has no variable for "the home directory", and hostPath.path and
# workingDir can't reference an env var, hence a placeholder rather than $(HOME).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus
spec:
  replicas: 1
  # A pod has to stay Ready this long before it counts as available, so the deploy
  # workflow's `kubectl rollout status` also catches a process that comes up and dies
  # within seconds; the readiness probe alone would pass in that window.
  minReadySeconds: 10
  # Recreate, not RollingUpdate: single-file SQLite plus in-process cron plus
  # Telegram long-polling means even a few seconds of old and new pods coexisting
  # would duplicate reports and fight over getUpdates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argus
  template:
    metadata:
      labels:
        app: argus
    spec:
      hostNetwork: true
      containers:
        - name: argus
          image: argus:dev
          imagePullPolicy: Never
          # Same as argus.service's WorkingDirectory: .env and data/ are found by
          # relative path.
          workingDir: __HOME__/apps/argus
          env:
            - name: HOME
              value: __HOME__
            # The host finds agy through a /usr/local/bin symlink that this image's
            # /usr/local/bin doesn't have; without this the Antigravity fallback fails
            # with "executable not found" the first time Claude errors out. $(HOME) is
            # expanded by Kubernetes from the HOME entry above, which has to come first.
            - name: ANTIGRAVITY_CLI_COMMAND
              value: $(HOME)/.local/bin/agy
          securityContext:
            # uid/gid of the account that owns the home, so the hostPath is writable
            # and file ownership doesn't change.
            runAsUser: __UID__
            runAsGroup: __GID__
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Requests only, no limits: claude-agent-acp is a Node child process, and an
          # OOMKill from a limit would cut an LLM call off mid-flight with no warning.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          # The dashboard listener: app.Run exits when it can't bind, so a connect means
          # the process got through boot. host is spelled out because the dashboard
          # listens on loopback only (WEB_ADDR=127.0.0.1:8090 in .env, keep the port in
          # step), and the default, the pod IP, is the node's address under hostNetwork.
          readinessProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 8090
            periodSeconds: 5
          volumeMounts:
            - name: home
              mountPath: __HOME__
      volumes:
        - name: home
          hostPath:
            path: __HOME__
            type: Directory
      # Readiness only, no liveness probe: there is no /healthz yet, and a tcp connect
      # can't tell a hung process from a busy one, so recovery relies on the process
      # exiting and the kubelet restarting it, the same as systemd's Restart=on-failure.
      # The Settings page's os.Exit(1) after a save goes through this path too.
