name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# 防止兩次部署同時跑（第二次觸發會排隊等第一次結束）— a burst of merges to
# main queues up their deploy runs one after another rather than overlapping.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run only fires when CI completes on the main branch (due to the
    # branches filter above). We check conclusion == 'success' to ensure CI
    # passed before deploying. workflow_dispatch has no workflow_run event
    # and is let through unconditionally for manual triggers.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # GOOS/GOARCH pinned explicitly (rather than relying on the hosted
      # runner's defaults) since this binary is cross-compiled here and then
      # shipped to the VPS in the deploy job below — it never runs on the
      # machine that builds it.
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o argus.new ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: argus-binary
          path: argus.new
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: argus-binary

      - name: Install binary
        run: |
          mkdir -p "$HOME/apps/argus"
          chmod +x argus.new
          # mv 是原子的 rename，即使舊 binary 正在執行也不會遇到 "text file busy"
          mv -f argus.new "$HOME/apps/argus/argus"

      - name: Restart service
        run: |
          # runner 以服務身分跑時沒有 login session 環境，
          # 需要手動指向 user bus 才能用 systemctl --user
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user restart argus

      - name: Verify
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sleep 3
          systemctl --user is-active argus
          journalctl --user -u argus -n 20 --no-pager || true
